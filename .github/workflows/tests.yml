name: Public pipeline tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-public-pipeline:
    name: Python 3.12 public pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Display Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm private SABI workbook is absent
        run: |
          if find data/raw -type f \( -iname "*.xlsx" -o -iname "*.xls" -o -iname "*.xlsb" \) | grep -q .; then
            echo "A private spreadsheet was found in data/raw."
            exit 1
          fi

          echo "No private SABI workbook is present."

      - name: Run public automated tests
        run: python -m pytest -m "not private_data" -v

      - name: Generate synthetic public dataset
        run: python -m src.generate_synthetic_data

      - name: Validate synthetic dataset
        run: |
          test -f data/sample/companies_synthetic.csv
          test -f data/sample/companies_synthetic_metadata.json

          python -c "import pandas as pd; df = pd.read_csv('data/sample/companies_synthetic.csv'); assert df.shape == (120, 10); assert df['company_name'].str.startswith('SYNTHETIC ').all(); print('Synthetic dataset validated:', df.shape)"

      - name: Execute synthetic pipeline
        run: python -m src.pipeline --source synthetic

      - name: Export synthetic analytical results
        run: python -m src.export_results

      - name: Generate synthetic figures
        run: python -m src.visualization

      - name: Confirm analytical tables were created
        run: |
          test -f reports/tables/synthetic/scope_comparison.csv
          test -f reports/tables/synthetic/coverage.csv
          test -f reports/tables/synthetic/quality_summary.csv
          test -f reports/tables/synthetic/revenue_concentration.csv
          test -f reports/tables/synthetic/revenue_percentiles.csv
          test -f reports/tables/synthetic/company_ranking.csv
          test -f reports/tables/synthetic/municipality_summary.csv
          test -f reports/tables/synthetic/run_metadata.json
          test -f reports/tables/synthetic/export_manifest.json

          echo "All required analytical tables and metadata exist."

      - name: Confirm public figures were created
        run: |
          test -s reports/figures/coverage.png
          test -s reports/figures/revenue_percentiles.png
          test -s reports/figures/revenue_concentration.png
          test -s reports/figures/company_ranking.png
          test -s reports/figures/municipality_summary.png

          echo "All required public figures exist and are non-empty."

      - name: Confirm public outputs contain only synthetic companies
        run: |
          python -c "import pandas as pd; path = 'reports/tables/synthetic/companies_quality_controlled.csv'; df = pd.read_csv(path); assert len(df) == 120; assert df['company_name'].str.startswith('SYNTHETIC ').all(); print('Public company-level export validated:', df.shape)"

      - name: Upload public pipeline artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capexquant-public-results-python-3.12
          path: |
            data/sample/companies_synthetic.csv
            data/sample/companies_synthetic_metadata.json
            reports/tables/synthetic/
            reports/figures/
          if-no-files-found: error
          retention-days: 7